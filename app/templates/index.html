<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDH Bulk Up</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --line: #334155;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #60a5fa;
        --success: #22c55e;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1, h2, h3, p { margin-top: 0; }
      .layout {
        display: grid;
        grid-template-columns: 370px minmax(0, 1fr);
        gap: 1rem;
      }
      .panel {
        background: var(--panel-alt);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
      }
      label {
        display: flex;
        flex-direction: column;
        color: var(--muted);
        font-size: 0.85rem;
        gap: 0.35rem;
      }
      input, select, button {
        font: inherit;
      }
      input, select {
        background: #0f172a;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.7rem;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
      }
      .results {
        list-style: none;
        padding: 0;
        margin: 1rem 0 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .result {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
        cursor: pointer;
        transition: border-color 0.15s ease;
      }
      .result:hover {
        border-color: var(--accent);
      }
      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
      }
      .pill {
        font-size: 0.75rem;
        background: rgba(96, 165, 250, 0.18);
        color: var(--accent);
        padding: 0.25rem 0.5rem;
        border-radius: 999px;
      }
      .muted { color: var(--muted); }
      .analysis-block {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }
      .tag-group {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 0.75rem;
        padding: 0.7rem 0.8rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.75rem;
        color: var(--muted);
      }
      .small {
        font-size: 0.8rem;
      }
      .filter-section {
        width: 100%;
        margin-top: 0.25rem;
      }
      .checkboxes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.75rem;
        margin-top: 0.4rem;
      }
      .checkboxes label {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        gap: 0.25rem;
        color: var(--text);
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EDH Bulk Up</h1>

      <div class="layout">
        <section class="panel">
          <h2>Collection</h2>
          <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" />
            <button type="submit">Upload CSV</button>
          </form>
          <pre id="upload-result" class="small">Upload a CSV to begin searching.</pre>

          <h2 style="margin-top: 1.5rem;">Find commanders</h2>
          <form id="search-form">
            <fieldset class="filter-section">
              <legend>Exact identity</legend>
              <div class="checkboxes">
                <label><input type="checkbox" name="identity_colors" value="W" /> W</label>
                <label><input type="checkbox" name="identity_colors" value="U" /> U</label>
                <label><input type="checkbox" name="identity_colors" value="B" /> B</label>
                <label><input type="checkbox" name="identity_colors" value="R" /> R</label>
                <label><input type="checkbox" name="identity_colors" value="G" /> G</label>
                <label><input type="checkbox" name="identity_colors" value="C" /> C</label>
              </div>
            </fieldset>
            <fieldset class="filter-section">
              <legend>Contains all colors</legend>
              <div class="checkboxes">
                <label><input type="checkbox" name="contains_colors" value="W" /> W</label>
                <label><input type="checkbox" name="contains_colors" value="U" /> U</label>
                <label><input type="checkbox" name="contains_colors" value="B" /> B</label>
                <label><input type="checkbox" name="contains_colors" value="R" /> R</label>
                <label><input type="checkbox" name="contains_colors" value="G" /> G</label>
                <label><input type="checkbox" name="contains_colors" value="C" /> C</label>
              </div>
            </fieldset>
            <fieldset class="filter-section">
              <legend>Exclude colors</legend>
              <div class="checkboxes">
                <label><input type="checkbox" name="exclude_colors" value="W" /> W</label>
                <label><input type="checkbox" name="exclude_colors" value="U" /> U</label>
                <label><input type="checkbox" name="exclude_colors" value="B" /> B</label>
                <label><input type="checkbox" name="exclude_colors" value="R" /> R</label>
                <label><input type="checkbox" name="exclude_colors" value="G" /> G</label>
                <label><input type="checkbox" name="exclude_colors" value="C" /> C</label>
              </div>
            </fieldset>
            <label>
              Excluded commanders
              <input type="text" name="exclude_commanders" placeholder="Name 1, Name 2" />
            </label>
            <label style="min-width: 160px;">
              <span>Advanced filters</span>
              <span style="display:flex; gap:0.5rem; align-items:center; margin-top:0.25rem;">
                <label><input type="checkbox" name="exclude_face" checked /> Exclude face</label>
                <label><input type="checkbox" name="exclude_partners" checked /> Exclude partners</label>
              </span>
            </label>
            <label>
              Limit
              <input type="number" name="limit" value="10" min="1" max="50" />
            </label>
            <button type="submit">Search</button>
          </form>

          <ul id="search-results" class="results"></ul>
        </section>

        <section class="panel">
          <h2>Commander analysis</h2>
          <div id="analysis-result" class="analysis-block muted">
            Select a commander from the list to inspect.
          </div>
        </section>
      </div>
    </main>

    <script>
      const uploadForm = document.getElementById('upload-form');
      const uploadResult = document.getElementById('upload-result');
      const searchForm = document.getElementById('search-form');
      const searchResults = document.getElementById('search-results');
      const analysisResult = document.getElementById('analysis-result');

      function renderAnalysis(details) {
        const replacementGroups = (details.replacements_by_tag || []).map((group) => {
          return `
            <div class="tag-group">
              <h3>${group.tag}</h3>
              <p class="muted">Missing cards: ${group.missing_cards.join(', ') || '—'}</p>
              <ul>${(group.replacements || []).map((card) => `<li>${card}</li>`).join('')}</ul>
            </div>
          `;
        }).join('');

        analysisResult.innerHTML = `
          <div>
            <h3>${details.commander_name}</h3>
            <p class="muted">Identity: ${details.identity} • Match: ${details.match_percentage.toFixed(2)}%</p>
            <p>Owned: ${details.owned_count} • Missing: ${details.missing_count}</p>
          </div>

          <div class="analysis-block">
            <h3>Missing cards</h3>
            <p>${(details.missing_cards || []).join(', ') || 'None'}</p>
          </div>

          <div class="analysis-block">
            <h3>Replacement groups</h3>
            ${replacementGroups || '<p class="muted">No replacement groups available.</p>'}
          </div>

          <div class="analysis-block">
            <h3>Same-type replacements</h3>
            ${Object.entries(details.same_type_replacements || {}).map(([card, replacements]) => `
              <div class="tag-group">
                <strong>${card}</strong>
                <ul>${replacements.map((r) => `<li>${r}</li>`).join('')}</ul>
              </div>
            `).join('') || '<p class="muted">No same-type replacements available.</p>'}
          </div>
        `;
      }

      uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(uploadForm);
        const response = await fetch('/api/collection/upload', { method: 'POST', body: formData });
        const data = await response.json();
        uploadResult.textContent = JSON.stringify(data, null, 2);
        if (response.ok) {
          searchForm.requestSubmit();
        }
      });

      searchForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(searchForm);
        const params = new URLSearchParams(formData);
        const response = await fetch(`/api/search?${params.toString()}`);
        const data = await response.json();

        searchResults.innerHTML = '';
        if (!response.ok) {
          searchResults.innerHTML = `<li class="muted">${data.detail || 'Upload a collection CSV first.'}</li>`;
          return;
        }
        data.forEach((item) => {
          const li = document.createElement('li');
          li.className = 'result';
          li.innerHTML = `
            <div class="result-header">
              <strong>${item.commander_name}</strong>
              <span class="pill">${item.identity}</span>
            </div>
            <div class="muted small">${item.match_percentage.toFixed(2)}% match • ${item.owned_count}/${item.deck_size} cards</div>
          `;
          li.addEventListener('click', async () => {
            const response = await fetch(`/api/commanders/${encodeURIComponent(item.commander_name)}`);
            const details = await response.json();
            renderAnalysis(details);
          });
          searchResults.appendChild(li);
        });
      });

    </script>
  </body>
</html>
